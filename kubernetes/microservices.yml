# Ordini
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordini-deployment
spec:
  selector:
    matchLabels:
      app: ordini
  template:
    metadata:
      labels:
        app: ordini
    spec:
      containers:
      - name: ordini
        image: ghcr.io/a12andre31/unipr-ordini:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        volumeMounts:
        - name: ordini-config-volume
          mountPath: /app/appsettings.json
          subPath: appsettings.json
          readOnly: true
        - name: shared-cookie-keys
          mountPath: /SharedCookieKeys
      volumes:
      - name: ordini-config-volume
        configMap:
          name: ordini-config
      - name: shared-cookie-keys
        persistentVolumeClaim:
          claimName: shared-cookie-keys-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ordini-service
spec:
  selector:
    app: ordini
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
